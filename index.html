<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Highway Car Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a0f00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Start Menu / Color Picker Screen */
        #start-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: white;
        }

        #start-menu h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #ffaa00;
            text-shadow: 0 2px 10px rgba(255,170,0,0.5);
        }

        #start-menu p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .color-options {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 15px white;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            pointer-events: none;
            display: none; /* Game shuru hone par show hoga */
        }

        .hud-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
            display: none; /* Game shuru hone par show hoga */
        }

        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
        }

        .btn:active {
            background: rgba(255, 165, 0, 0.3);
            border-color: rgba(255, 165, 0, 0.6);
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.5);
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            color: white;
            display: none;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }

        #game-over h1 { margin-top: 0; color: #ff4757; }
        #game-over button {
            padding: 10px 25px;
            background: #2ed573;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Start Menu with Color Picker -->
    <div id="start-menu">
        <h1>CHOOSE CAR COLOR</h1>
        <p>Select your favorite color to start driving</p>
        <div class="color-options">
            <div class="color-btn" style="background: #ff3838;" onclick="startGame(0xff3838)"></div>
            <div class="color-btn" style="background: #3867d6;" onclick="startGame(0x3867d6)"></div>
            <div class="color-btn" style="background: #2ed573;" onclick="startGame(0x2ed573)"></div>
            <div class="color-btn" style="background: #ffa502;" onclick="startGame(0xffa502)"></div>
            <div class="color-btn" style="background: #2f3640;" onclick="startGame(0x2f3640)"></div>
        </div>
    </div>

    <div id="hud">
        <div class="hud-card">Speed: <span id="speed-val">0</span> km/h</div>
        <div class="hud-card">Distance: <span id="dist-val">0</span> m</div>
    </div>

    <div id="controls">
        <div class="control-group">
            <div class="btn" id="btn-up">⬆️</div>
            <div class="btn" id="btn-down">⬇️</div>
        </div>
        <div class="control-group">
            <div class="btn" id="btn-left">⬅️</div>
            <div class="btn" id="btn-right">➡️</div>
        </div>
    </div>

    <div id="game-over">
        <h1>CRASHED!</h1>
        <p>You traveled <span id="final-dist">0</span> meters.</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <!-- Include Three.js & OBJLoader via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    
    <script>
        let scene, camera, renderer, car;
        let roadSegments = [];
        let speed = 0, maxSpeed = 1.2, acceleration = 0.005, deceleration = 0.01;
        let distance = 0;
        let isGameOver = false;
        let targetCarRotationZ = 0;
        let gameStarted = false;
        let chosenCarColor = 0xff3838; // Default color

        const keys = { up: false, down: false, left: false, right: false };

        function startGame(colorHex) {
            chosenCarColor = colorHex;
            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('controls').style.display = 'flex';
            
            if (!scene) {
                init();
            }
            gameStarted = true;
            animate();
        }

        function init() {
            // Scene & Fog (Sunset Desert Vibe)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffb366);
            scene.fog = new THREE.FogExp2(0xffb366, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Renderer with Tone Mapping for Cinematic Look
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff0e6, 0.9);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Create Desert Ground
            const groundGeo = new THREE.PlaneGeometry(2000, 2000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xd2a679, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            scene.add(ground);

            // Build Initial Road Segments
            for (let i = 0; i < 15; i++) {
                createRoadSegment(-i * 40);
            }

            // Load Custom Car Model (.obj) with Chosen Color
            createCar();

            // Event Listeners for Keyboard & Touch
            setupControls();
            window.addEventListener('resize', onWindowResize);
        }

        function createRoadSegment(zPos) {
            const roadGroup = new THREE.Group();
            
            const roadGeo = new THREE.PlaneGeometry(16, 40);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            roadGroup.add(road);

            const lineGeo = new THREE.PlaneGeometry(0.4, 40);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.y = 0.01;
            roadGroup.add(line);

            const railGeo = new THREE.BoxGeometry(0.5, 1, 40);
            const railMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 });
            
            const leftRail = new THREE.Mesh(railGeo, railMat);
            leftRail.position.set(-8.2, 0.5, 0);
            leftRail.castShadow = true;
            roadGroup.add(leftRail);

            const rightRail = new THREE.Mesh(railGeo, railMat);
            rightRail.position.set(8.2, 0.5, 0);
            rightRail.castShadow = true;
            roadGroup.add(rightRail);

            roadGroup.position.z = zPos;
            scene.add(roadGroup);
            roadSegments.push(roadGroup);
        }

        function createCar() {
            car = new THREE.Group();
            
            const loader = new THREE.OBJLoader();
            loader.load('sdxmustang.obj', function (object) {
                object.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // Player ke choose kiye hue color ko apply karein
                        child.material = new THREE.MeshStandardMaterial({ 
                            color: chosenCarColor, 
                            roughness: 0.2, 
                            metalness: 0.8 
                        });
                    }
                });

                object.scale.set(1, 1, 1);
                object.position.set(0, 0, 0);
                car.add(object);
            }, undefined, function (error) {
                console.error('Car load karne mein error aya:', error);
            });

            car.position.set(0, 0, 0);
            scene.add(car);
        }

        function setupControls() {
            const bindButton = (id, keyName) => {
                const el = document.getElementById(id);
                el.addEventListener('mousedown', () => keys[keyName] = true);
                el.addEventListener('mouseup', () => keys[keyName] = false);
                el.addEventListener('mouseleave', () => keys[keyName] = false);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            };

            bindButton('btn-up', 'up');
            bindButton('btn-down', 'down');
            bindButton('btn-left', 'left');
            bindButton('btn-right', 'right');

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
                if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
                if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            });
        }

        function animate() {
            if (!gameStarted || isGameOver) return;

            requestAnimationFrame(animate);

            if (keys.up) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (keys.down) {
                speed = Math.max(speed - deceleration * 2, 0);
            } else {
                speed = Math.max(speed - deceleration, 0);
            }

            if (keys.left && car.position.x > -7) {
                car.position.x -= 0.15;
                targetCarRotationZ = 0.08;
            } else if (keys.right && car.position.x < 7) {
                car.position.x += 0.15;
                targetCarRotationZ = -0.08;
            } else {
                targetCarRotationZ = 0;
            }

            car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, targetCarRotationZ, 0.15);

            if (speed > 0) {
                distance += Math.round(speed * 10);
                roadSegments.forEach(segment => {
                    segment.position.z += speed;
                });

                roadSegments.forEach(segment => {
                    if (segment.position.z > 20) {
                        const furthestZ = Math.min(...roadSegments.map(s => s.position.z));
                        segment.position.z = furthestZ - 40;
                    }
                });
            }

            camera.position.x = car.position.x * 0.5;
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, car.position.y + 3.5, 0.1);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, car.position.z + 7, 0.1);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z - 2);

            document.getElementById('speed-val').innerText = Math.round(speed * 150);
            document.getElementById('dist-val').innerText = distance;

            renderer.render(scene, camera);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('final-dist').innerText = distance;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            isGameOver = false;
            speed = 0;
            distance = 0;
            car.position.set(0, 0, 0);
            document.getElementById('game-over').style.display = 'none';
            animate();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
